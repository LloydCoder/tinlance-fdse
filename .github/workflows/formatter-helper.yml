name: Formatter helper

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff==0.13.0
      - name: Format
        run: ruff format scripts/tsic_conformance.py
      - name: Print formatted source
        run: cat scripts/tsic_conformance.py
      - name: Check formatted source
        run: ruff format --check scripts/tsic_conformance.py
