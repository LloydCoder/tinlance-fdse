name: Temporary Ruff Formatter

on:
  push:
    branches: [feat/m2-intake]

permissions:
  contents: write

jobs:
  format:
    if: "!startsWith(github.event.head_commit.message, 'chore(fdse): apply Ruff format')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b1
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff==0.13.0

      - name: Format
        run: ruff format .

      - name: Commit formatting
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore(fdse): apply Ruff format"
          git push origin "HEAD:${GITHUB_REF_NAME}"
