name: CI
# Public PRs use GitHub-hosted isolation. Trusted main pushes may use the
# repository-scoped self-hosted runner.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fdse-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python for public PRs
        if: github.event_name == 'pull_request'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"

      - name: Set up trusted runner Python
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv "${RUNNER_TEMP}/fdse-venv"
          echo "${RUNNER_TEMP}/fdse-venv/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/fdse-venv/bin/python" -m pip install --upgrade pip

      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check --diff .
      - name: Mypy
        run: mypy src
      - name: Tests
        run: pytest
      - name: Dependency audit
        run: pip-audit --skip-editable
      - name: Build
        run: python -m build --no-isolation
      - name: Documentation validation
        run: python scripts/check_docs.py
      - name: Inspect generated artifacts
        run: |
          python - <<'PY'
          import glob
          from pathlib import Path
          artifacts = [Path(p) for p in glob.glob("dist/*")]
          assert artifacts, "build produced no artifacts"
          assert all(p.is_file() and p.stat().st_size > 0 for p in artifacts)
          print("\n".join(str(p) for p in artifacts))
          PY
