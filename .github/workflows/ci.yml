name: CI
# All repository-controlled CI executes on GitHub-hosted runners.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fdse-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy src
      - name: Tests
        run: pytest
      - name: Dependency audit
        run: pip-audit --skip-editable
      - name: Build
        run: python -m build --no-isolation
      - name: Documentation validation
        run: python scripts/check_docs.py
      - name: Inspect generated artifacts
        run: |
          python - <<'PY'
          import glob
          from pathlib import Path
          artifacts = [Path(p) for p in glob.glob("dist/*")]
          assert artifacts, "build produced no artifacts"
          assert all(p.is_file() and p.stat().st_size > 0 for p in artifacts)
          print("\n".join(str(p) for p in artifacts))
          PY

  # Temporary formatting repair for the documentation-reconciliation branch.
  # This job is deliberately branch-scoped and will be removed after the
  # repository is fully formatted.
  format_repair:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'docs/reconcile-readme-2026-09-28'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff==0.13.0
      - name: Format branch
        run: ruff format .
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: format Python sources"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

  compatibility:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: pytest

  attest:
    name: Artifact provenance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --no-cache-dir setuptools==83.0.0 build==1.3.0
      - name: Build distributions
        run: python -m build
      - name: Attest distributions
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: "dist/*"
