[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tinlance-fdse"
version = "1.9.0"
description = "Governed, evidence-driven forward-deployed software engineering domain layer."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tinlance" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "setuptools==83.0.0",
  "mypy==1.18.2",
  "pytest==9.0.3",
  "build==1.3.0",
  "pip-audit==2.10.1",
  "ruff==0.13.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["fdse"]
