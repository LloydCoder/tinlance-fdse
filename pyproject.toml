[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tinlance-fdse"
version = "0.1.0"
description = "Governed, evidence-driven forward-deployed software engineering domain layer."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Tinlance"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.13,<0.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/fdse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E","F","I","B","UP","S"]
ignore = ["S101"]
